#config_version=6

slides:
  dspc_animation_slide:
  - widget: dspc_animation
  splash_slide:
  - widget: splash
  - widget: champ_label
  - widget: champ_value
  - widget: first_place
  - widget: second_place
  - widget: third_place
  - widget: laps_champ_label
  - widget: laps_champ_value
  # Gameplay tips (see modes/tips). A tip with an `image`
  # uses tip_<image>_slide: that mode's background under an
  # 80% black overlay. Tips without one use tip_slide.
  tip_slide:
  - widget: tip_background
  - widget: tip_header
  - widget: tip_title
  - widget: tip_line1
  - widget: tip_line2
  - widget: tip_line3
  - widget: tip_line4
  tip_green_flag_slide:
  - widget: green_flag_background
  - widget: tip_dim
  - widget: tip_header
  - widget: tip_title
  - widget: tip_line1
  - widget: tip_line2
  - widget: tip_line3
  - widget: tip_line4
  pit_slide:
  - widget: pit_background
  - widget: pit_mirror
  - widget: rear_view
  - widget: fuel_(current_player.level_fuel)
  - widget: lube_(current_player.level_lube)
  - widget: tires_(current_player.level_tires)
  - widget: laps_key
  - widget: laps_value
  - widget: ball_key
  - widget: ball_value
  - widget: driver_name
  green_flag_slide:
  - widget: green_flag_background
  - widget: green_flag_mirror
  - widget: rear_view
  - widget: fuel_(current_player.level_fuel)
  - widget: lube_(current_player.level_lube)
  - widget: tires_(current_player.level_tires)
  - widget: laps_key
  - widget: laps_value
  - widget: ball_key
  - widget: ball_value
  - widget: driver_name
  luxury_slide:
  - widget: luxury
  - widget: overlay_right
  - widget: mode_name
  grooveline_slide:
  - widget: grooveline
  - widget: overlay_right
  - widget: mode_name
  grand_prix_slide:
  - widget: grand_prix
  - widget: overlay_right
  - widget: mode_name
  backfire_slide:
  - widget: backfire
  - widget: overlay_right
  - widget: mode_name
  extra_ball_slide:
  - widget: extra_ball
