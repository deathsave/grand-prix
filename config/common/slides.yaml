#config_version=6

slides:
  dspc_animation_slide:
  - widget: dspc_animation
  splash_slide:
  - widget: splash
  - widget: champ_label
  - widget: champ_value
  - widget: first_place
  - widget: second_place
  - widget: third_place
  - widget: laps_champ_label
  - widget: laps_champ_value
  # Gameplay tips (see modes/tips). A tip with a `mode`
  # uses tip_<mode>_slide (usually that mode's background
  # under an 80% black overlay). Tips without one use
  # tip_slide.
  tip_slide:
  - widget: tip_background
  - widget: tip_header
  - widget: tip_title
  - widget: tip_line1
  - widget: tip_line2
  - widget: tip_line3
  - widget: tip_line4
  tip_green_flag_slide:
  - widget: green_flag_background
  - widget: tip_dim
  - widget: tip_header
  - widget: tip_title
  - widget: tip_line1
  - widget: tip_line2
  - widget: tip_line3
  - widget: tip_line4
  tip_backfire_slide:
