  # Flag) until the green flag drops or the end of the ball (a loop; it's
  # louder than the idle, so a bit lower). The engines sit well
  # under everything else
  engine_pace:
    file: engine-pace.wav
    track: effects
    volume: 0.05
    fade_out: 0.5s
