  # music). crash2 is about 4.5 dB louder, so it's turned down to match
  crash1:
    file: crash1.wav
    track: effects
  crash2:
    file: crash2.wav
    track: effects
    volume: 0.6
  # starting up as the ball reaches the shooter lane, then idling
  # there (a loop, see misc/reverb.yaml) until the plunge
  # (see modes/pit/code/pit.py)
  engine_start:
    file: engine-start.wav
    track: effects
    volume: 0.15
    fade_out: 0.2s
  engine_idle:
    file: engine-idle.wav
    track: effects
    volume: 0.1
    fade_in: 0.2s
    fade_out: 0.3s
