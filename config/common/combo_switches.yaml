#config_version=6

combo_switches:
  # the right flipper + start, held 2s
  # (its own name: MPF's both_flippers combo, left + right flipper,
  # posts flipper_cancel, which skips through the end of ball bonus)
  shutdown_combo:
    tag_1: right_flipper
    tag_2: start
    events_when_both: shutdown
    hold_time: 2s
  # the left flipper + start, held 2s: free play <-> credit play
  # (see credits.yaml)
  free_play_toggle:
    tag_1: left_flipper
    tag_2: start
    events_when_both: toggle_credit_play
    hold_time: 2s
