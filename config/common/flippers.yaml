#config_version=6

flippers:
  left_flipper:
    main_coil: c_flipper1
    #hold_coil: c_flipper1_hold
    activation_switch: s_flipper1
    # NOTE: setting disable_events replaces MPF's defaults
    # (ball_will_end, service_mode_entered), so they must be
    # listed here too or the flippers stay on into attract
    disable_events:
    - ball_will_end
    - service_mode_entered
    - green_flag_bad_luck
    # OPP doesn't support this apparently
    use_eos: false
    label: Left Flipper
  right_flipper:
    main_coil: c_flipper2
    #hold_coil: c_flipper2_hold
    activation_switch: s_flipper2
    # NOTE: setting disable_events replaces MPF's defaults
    # (ball_will_end, service_mode_entered), so they must be
    # listed here too or the flippers stay on into attract
    disable_events:
    - ball_will_end
    - service_mode_entered
    - green_flag_bad_luck
    use_eos: false
    label: Right Flipper
