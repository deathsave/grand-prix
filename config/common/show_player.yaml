#config_version=6

show_player:
  light_all:
    lights_blink:
      show_tokens:
        lights: tag_lights
  s_flipper1_active:
    light_one: advance
  s_flipper2_active:
    light_one: step_back
  player_will_add:
    chime_default:
      loops: 0
  # A match chimes a pair of different chimes (1 then 3, like an EM
  # knocking off a replay) for each player who matched. The match mode
  # posts match_has_match as the spin ends, and stops straight after,
  # so this is machine-wide (a mode's show stops with it).
  match_has_match{winners == 1}:
    match_chimes:
      loops: 0
  match_has_match{winners == 2}:
    match_chimes:
      loops: 1
  match_has_match{winners == 3}:
    match_chimes:
      loops: 2
  match_has_match{winners == 4}:
    match_chimes:
      loops: 3
  # A long shaker rumble for the big moments: a multiball starting, the
  # super jackpots (Luxury's only when its shots are all claimed: its
  # shot group also posts luxury_complete as it starts), Red Line's
  # checkered flag and the Under Red crash
  multiball_started:
    shaker_rumble:
      loops: 0
  grooveline_super_jackpot:
    shaker_rumble:
      loops: 0
    # the chimes roll 3 times, then the call out (see
    # shows/super_jackpot_chimes.yaml)
    super_jackpot_chimes:
      loops: 0
  grand_prix_super_jackpot:
    shaker_rumble:
      loops: 0
    # the chimes roll 3 times, then the call out (see
    # shows/super_jackpot_chimes.yaml)
    super_jackpot_chimes:
      loops: 0
  luxury_complete{state == "claimed"}:
    shaker_rumble:
      loops: 0
    # the chimes roll 3 times, then the call out (see
    # shows/super_jackpot_chimes.yaml)
    super_jackpot_chimes:
      loops: 0
  red_line_checkered_flag:
    shaker_rumble:
      loops: 0
    # the chimes roll 3 times, then the call out (see
    # shows/super_jackpot_chimes.yaml)
    super_jackpot_chimes:
      loops: 0
  mode_under_red_started:
    shaker_rumble:
      loops: 0
