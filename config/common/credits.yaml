#config_version=6

# Credits (MPF's built-in credits mode, in modes.yaml)
#
# The coin mech (s_credit) takes quarters: 50 cents a game, 3 for
# a dollar. Free play is the default; start + the physically right flipper
# (held 2s, see combo_switches.yaml) toggles between free play and
# credit play, and MPF saves it (the free_play setting) so it
# survives a restart. (Until there's a maintenance mode.) A match
# awards a free credit in credit play.
credits:
  free_play: yes
  max_credits: 30
  switches:
  - switch: s_credit
    type: money
    value: .25
  # a match is a free credit for each player who matched (only in
  # credit play: MPF only listens for these then)
  events:
  - event: match_has_match
    credits: winners
    type: match
  # a replay (see code/replay.py)
  - event: replay_credit
    credits: 1
    type: replay
  pricing_tiers:
  - price: .50
    credits: 1
  - price: 1
    credits: 3
  credits_string: CREDITS
  free_play_string: FREE PLAY

# A coin shows the credits slide, up until 5s after the last one
slide_player:
  credits_added:
    credits_slide:
      expire: 5s
      priority: 1000000

# What the display says (over whatever's showing)
widget_player:
  not_enough_credits:
    credits_insert_coins:
      key: credits_message
      widget_settings:
        expire: 3s
  enabling_free_play:
    credits_free_play:
      key: credits_message
      widget_settings:
        expire: 3s
  enabling_credit_play:
    credits_credit_play:
      key: credits_message
      widget_settings:
        expire: 3s

slides:
  credits_slide:
  - widget: splash
  - widget: credits_slide_content

widgets:
  credits_slide_content:
  # (a color with alpha: opacity on a rectangle draws it solid)
  - type: rectangle
    width: 800
    height: 480
    color: 000000bb
    z: 1
  - type: text
    text: CREDITS
    z: 2
    y: middle+30%
    color: cyan
    style: text_default
    font_size: 70
  - type: text
    text: (machine|credits_value)
    z: 2
    y: middle+2%
    color: yellow
    style: medium
    font_size: 150
  - type: text
    text: 50c a game, 3 for $1
    z: 2
    y: middle-24%
    color: white
    style: medium
    font_size: 32
  - type: text
    text: PRESS START
    z: 2
    y: middle-37%
    color: pink
    style: text_default
    font_size: 44
    animations:
      add_to_slide: pulsate_fast
  # on the attract splash (config/common/slides.yaml), bottom right
  credits_splash:
  # (like the high scores, on a dark oval: a color with alpha, 80%)
  - type: ellipse
    width: 270
    height: 56
    x: 66%
    y: bottom+11%
    color: 000000cc
    z: 2
  - type: text
    text: (machine|credits_string)
    x: 66%
    y: bottom+11%
    color: yellow
    style: medium
    font_size: 28
    z: 3
  credits_insert_coins:
  - type: rectangle
    width: 800
    height: 480
    color: 000000
    opacity: 0.6
    z: 30
  - type: text
    text: INSERT COINS
    z: 31
    y: middle+10%
    color: yellow
    style: text_default
    font_size: 100
    animations:
      add_to_slide: pulsate_fast
  - type: text
    text: 50c a game, 3 for $1
    z: 31
    y: middle-15%
    color: white
    style: medium
    font_size: 36
  credits_free_play:
  - type: rectangle
    width: 800
    height: 480
    color: 000000
    opacity: 0.6
    z: 30
  - type: text
    text: FREE PLAY
    z: 31
    color: lime
    style: text_default
    font_size: 110
  credits_credit_play:
  - type: rectangle
    width: 800
    height: 480
    color: 000000
    opacity: 0.6
    z: 30
  - type: text
    text: CREDIT PLAY
    z: 31
    y: middle+10%
    color: yellow
    style: text_default
    font_size: 100
  - type: text
    text: 50c a game, 3 for $1
    z: 31
    y: middle-15%
    color: white
    style: medium
    font_size: 36
