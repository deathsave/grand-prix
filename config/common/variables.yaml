#config_version=6

machine_vars:
  mode_name:
    initial_value: Pit
    value_type: str
    persist: false
  # Gameplay tip text, typed out by the Tips mode
  tip_title:
    initial_value: ""
    value_type: str
    persist: false
  tip_line1:
    initial_value: ""
    value_type: str
    persist: false
  tip_line2:
    initial_value: ""
    value_type: str
    persist: false
  tip_line3:
    initial_value: ""
    value_type: str
    persist: false
  tip_line4:
    initial_value: ""
    value_type: str
    persist: false
  # The replay score, adjusted after each game (see code/replay.py)
  replay_score:
    initial_value: 500000
    value_type: int
    persist: true
  replay_games_without:
    initial_value: 0
    value_type: int
    persist: true

player_vars:
  # got this game's replay (see code/replay.py)
  replay_awarded:
    initial_value: 0
    value_type: int
  name:
    initial_value: ""
    value_type: str
  evil_number:
    initial_value: 0
    value_type: int
  is_multiball_ready:
    initial_value: 0
  is_grand_prix_multiball_ready:
    initial_value: 0
  is_green_flag_completed:
    initial_value: 0
  lap_count:
    initial_value: 0
  # Red Line's shifts this game (the Shift Champ high score)
  shift_count:
    initial_value: 0
  spin_counter_count:
    initial_value: 0
  # a luxury step earned before green flag
  # starts (see pit variable/event players)
  luxury_step_pending:
    initial_value: 0
  backfire_counter_count:
    initial_value: 0
  # Red Line is at the red line, waiting for the shift
  # (see modes/red_line/code/red_line.py)
  red_line_at_redline:
    initial_value: 0

  # to know if we can open the loop gate
  # when ball leaves the shooter lane
  is_playfield_active:
    initial_value: 0

  # # TODO: per ball bonuses
  # bonus_main:
  #   initial_value: 0
  # bonus_laps:
  #   initial_value: 0
  # bonus_game_progress:
  #   initial_value: 0

  # 2 is full
  # 1 is partial
  # 0 is empty
  level_fuel:
    # player begins game with partially empty tank
    initial_value: 1
  level_lube:
    initial_value: 2
  level_tires:
    initial_value: 2
  multiplier:
    initial_value: 1
  # for extra ball
  is_awareness_completed:
    initial_value: 0
  ##########################
  ## Wizard Mode Progress ##
  ##########################
  is_luxury_completed:
    initial_value: 0
  is_grooveline_completed:
    initial_value: 0
  is_grand_prix_completed:
    initial_value: 0
  # ^ the above three enable red_line
  is_red_line_completed:
    initial_value: 0
  # Each multiball completed (its super jackpot, or Red Line's
  # checkered flag), for the end of ball bonus
  is_grooveline_super:
    initial_value: 0
  is_luxury_super:
    initial_value: 0
  is_grand_prix_super:
    initial_value: 0
  is_red_line_super:
    initial_value: 0
  # The outlane save: lit by completing the Grand counter, until an
  # outlane uses it (see modes/pit/code/pit.py)
  is_outlane_save_lit:
    initial_value: 0
  # The end of ball bonus's counts (see modes/pit/code/pit.py)
  bonus_multiballs:
    initial_value: 0
  bonus_supers:
    initial_value: 0
