    text: "00"
    min_digits: 2
    x: center
    y: bottom+15%
    style: big
    color: cyan
    font_size: 150
    z: 10
  champ_label:
  - type: text
    text: "Grand Champion"
    anchor_x: left
    z: 2
    x: 3%
    y: bottom+92%
    color: cyan
    style: text_default
    font_size: 60
  champ_value:
  - type: text
    text: "(machine|score1_name): (machine|score1_value)"
    anchor_x: left
    z: 2
    x: 3%
    y: bottom+78%
    color: white
    style: big
    font_size: 40
  first_place:
  - type: text
    text: "1st: (machine|score2_name) ((machine|score2_value))"
    anchor_x: left
    z: 2
    x: 3%
    y: bottom+69%
    color: white
    style: medium
    font_size: 28
  second_place:
  - type: text
    text: "2nd: (machine|score3_name) ((machine|score3_value))"
    anchor_x: left
    z: 2
    x: 3%
    y: bottom+62%
    color: white
    style: medium
    font_size: 28
  third_place:
  - type: text
    text: "3rd: (machine|score4_name) ((machine|score4_value))"
    anchor_x: left
    z: 2
    x: 3%
    y: bottom+55%
    color: white
    style: medium
    font_size: 28
  laps_champ_label:
  - type: text
    text: "Laps Champ"
    anchor_x: left
    z: 2
    x: 3%
    y: bottom+12%
    color: pink
    style: big
    font_size: 20
  laps_champ_value:
  - type: text
    text: "(machine|lap_count1_name): (machine|lap_count1_value) Laps"
    anchor_x: left
    z: 2
    x: 3%
    y: bottom+6%
    color: white
    style: medium
    font_size: 18
  mode_name:
  - type: text
    text: "(machine|mode_name)"
    z: 10
    x: 70%
    y: bottom+9%
    color: white
    style: text_default
    font_size: 52
    animations:
      add_to_slide: pulsate_fast
  # Off the Line countdown, with the under_green chimes (see the
  # green_flag mode's widget_player.yaml): Get Ready (from the
  # moment Green Flag starts, until the first chime), 3, 2, 1, Race!
  countdown_ready:
  - type: rectangle
    width: 800
    height: 480
    color: 000000
    opacity: 0.5
    z: 22
  - type: text
    text: "Get Ready"
    z: 23
    color: white
    style: text_default
    font_size: 120
    animations:
      add_to_slide: pulsate_fast
  countdown3:
  - type: rectangle
    width: 800
    height: 480
    color: 000000
    opacity: 0.5
    z: 22
  - type: text
    text: "3"
    z: 23
    color: red
    style: text_default
    font_size: 300
    animations:
      add_to_slide: countdown_fade
  countdown2:
  - type: rectangle
    width: 800
    height: 480
    color: 000000
    opacity: 0.5
    z: 22
  - type: text
    text: "2"
    z: 23
    color: orange
    style: text_default
    font_size: 300
    animations:
      add_to_slide: countdown_fade
  countdown1:
  - type: rectangle
    width: 800
    height: 480
    color: 000000
    opacity: 0.5
    z: 22
  - type: text
    text: "1"
    z: 23
    color: yellow
    style: text_default
    font_size: 300
    animations:
      add_to_slide: countdown_fade
  # (Race! is like the jackpots: the green flag image under
  # its mode color, lime, at 60%)
  countdown_race:
  - type: image
    image: green-flag-background
    z: 22
  - type: rectangle
    width: 800
    height: 480
    color: lime
    opacity: 0.6
    z: 23
  - type: text
    text: "Race!"
    z: 24
    color: white
    style: text_default
    font_size: 200
    animations:
      add_to_slide: countdown_fade
  # Jackpot callouts, over the mode's slide: the mode's color
  # (see config/common/named_colors.yaml) at 60% and the text, while the callout
  # plays (see widget_player in those modes)
  jackpot_grooveline:
  - type: rectangle
    width: 800
    height: 480
    color: cyan
    opacity: 0.6
    z: 20
  - type: text
    text: "Jackpot!"
    z: 21
    color: white
    style: text_default
    font_size: 130
    animations:
      add_to_slide: pulsate_fast
  super_jackpot_grooveline:
  - type: rectangle
    width: 800
    height: 480
    color: cyan
    opacity: 0.6
    z: 20
  - type: text
    text: "SUPER JACKPOT!"
    z: 21
    color: white
    style: text_default
    font_size: 96
    animations:
      add_to_slide: pulsate_fast
  # Grand Prix's leader bonus (every lap), like the jackpots
  leader_bonus_grand_prix:
  - type: rectangle
    width: 800
    height: 480
    color: pink
    opacity: 0.6
    z: 20
  - type: text
    text: "Leader Bonus!"
    z: 21
    y: middle+12%
    color: white
    style: text_default
    font_size: 90
    animations:
      add_to_slide: pulsate_fast
  - type: text
    text: (value)
    number_grouping: true
    z: 21
    y: middle-15%
    color: white
    style: text_default
    font_size: 110
  jackpot_grand_prix:
  - type: rectangle
    width: 800
    height: 480
    color: pink
    opacity: 0.6
    z: 20
  - type: text
    text: "Jackpot!"
    z: 21
    color: white
    style: text_default
    font_size: 130
    animations:
      add_to_slide: pulsate_fast
  super_jackpot_grand_prix:
  - type: rectangle
    width: 800
    height: 480
    color: pink
    opacity: 0.6
    z: 20
  - type: text
    text: "SUPER JACKPOT!"
    z: 21
    color: white
    style: text_default
    font_size: 96
    animations:
      add_to_slide: pulsate_fast
  jackpot_luxury:
  - type: rectangle
    width: 800
    height: 480
    color: purple
    opacity: 0.6
    z: 20
  - type: text
    text: "Jackpot!"
    z: 21
    color: white
    style: text_default
    font_size: 130
    animations:
      add_to_slide: pulsate_fast
  super_jackpot_luxury:
  - type: rectangle
    width: 800
    height: 480
    color: purple
    opacity: 0.6
    z: 20
  - type: text
    text: "SUPER JACKPOT!"
    z: 21
    color: white
    style: text_default
    font_size: 96
    animations:
      add_to_slide: pulsate_fast
  jackpot_red_line:
  - type: rectangle
    width: 800
    height: 480
    color: red
    opacity: 0.6
    z: 20
  - type: text
    text: "Jackpot!"
    z: 21
    color: white
    style: text_default
    font_size: 130
    animations:
      add_to_slide: pulsate_fast
  super_jackpot_red_line:
  - type: rectangle
    width: 800
    height: 480
    color: red
    opacity: 0.6
    z: 20
  - type: text
    text: "CHECKERED FLAG!"
    z: 21
    color: white
    style: text_default
    font_size: 84
    animations:
      add_to_slide: pulsate_fast
  # at the red line, until the shift (see modes/red_line)
  red_line_shift:
  - type: text
    text: "SHIFT!"
    z: 15
    y: 70%
    color: red
    style: text_default
    font_size: 120
    animations:
      add_to_slide: pulsate_fast
  # Gameplay tips (see modes/tips). The text is "typed" by
  # the Tips mode updating these machine variables. Header and
  # title use the Grand Prix font; tip lines use pixelmix
  # (medium) for readability.
  tip_background:
  - type: rectangle
    width: 800
    height: 480
    color: 000000
    z: 0
  # dims a mode's background image behind the tip text.
  # NOTE: widget `opacity` is ignored by mpf-mc, so the
  # alpha goes in the color: cc = 80% opaque black
  tip_dim:
  - type: rectangle
    width: 800
    height: 480
    color: 000000cc
    z: 1
  tip_header:
  - type: text
    text: "Pit Crew Tip"
    anchor_x: left
    x: 5%
    y: bottom+88%
    z: 2
    color: pink
    style: text_default
    font_size: 32
  # Pure Evil tip: flashing white header, light red title
  tip_evil_header:
  - type: text
    text: "Pit Crew Tip"
    anchor_x: left
    x: 5%
    y: bottom+88%
    z: 2
    color: white
    style: text_default
    font_size: 32
    animations:
      add_to_slide: flash
  tip_evil_title:
  - type: text
    text: "(machine|tip_title)"
    anchor_x: left
    x: 5%
    y: bottom+74%
    z: 2
    color: light_red
    style: text_default
    font_size: 60
    animations:
      add_to_slide: flash
  # Mode tips color their title in the mode's color
  # (tip_title_<mode>, used by tip_<mode>_slide)
  tip_title:
  - type: text
    text: "(machine|tip_title)"
    anchor_x: left
    x: 5%
    y: bottom+74%
    z: 2
    color: lime
    style: text_default
    font_size: 60
  tip_title_backfire:
  - type: text
    text: "(machine|tip_title)"
    anchor_x: left
    x: 5%
    y: bottom+74%
    z: 2
    color: orange
    style: text_default
    font_size: 60
  tip_title_grooveline:
