    x: 64%
    y: 8.8%
    z: 5
    color: white
    font_size: 28
  ball_value:
  - type: text
    text: "(ball)"
    z: 5
    x: 70%
    y: 9%
    color: white
    style: medium
    font_size: 20
  driver_name:
  - type: text
    text: "(name)"
    x: 54.5%
    y: 9.5%
    z: 6
    color: cyan
    font_size: 42
  match_none:
  - type: image
    image: match-none
    z: 10
  match_00:
  - type: image
    image: match-00
