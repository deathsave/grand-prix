    image: rear-view
    z: 2
  grooveline:
  - type: image
    image: grooveline
  luxury:
  - type: image
    image: luxury
  luxury_shot:
  - type: image
    image: luxury-shot
  backfire:
  - type: image
    image: backfire
  grand_prix:
  - type: image
    image: grand-prix
  extra_ball:
  - type: image
    image: extra-ball
  red_line:
  - type: image
    image: red-line
  pure_evil:
  - type: image
    image: pure-evil
  # the Pure Evil mode slide's (pure_evil is also the
  # tip background, which doesn't pulsate)
  pure_evil_pulsing:
  - type: image
    image: pure-evil
    animations:
      add_to_slide: pulsate_evil
  lube_2:
