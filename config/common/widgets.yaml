    image: lube-2
    z: 3
    x: 9%
    y: 86%
  lube_1:
  - type: image
    image: lube-1
    z: 3
    x: 9%
    y: 86%
  lube_0:
  - type: image
    image: lube-0
    z: 3
    x: 9%
    y: 86%
  tires_2:
