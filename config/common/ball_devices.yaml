#config_version=6

ball_devices:
  bd_trough:
    ball_switches:
    - s_trough1
    - s_trough2
    - s_trough3
    tags:
    - trough
    - home
    - drain
    auto_fire_on_unexpected_ball: false
    eject_coil: c_trough
    eject_coil_jam_pulse: 15ms
    eject_targets: bd_shooter_lane
    eject_timeouts: 3s
    jam_switch: s_trough_jam
  bd_shooter_lane:
    ball_switches: s_shooter_lane
    eject_timeouts: 3s
    eject_coil: c_auto_kicker
    mechanical_eject: true
  # The kick-out holes confirm an eject after 2s (the default
  # is 10s). A ball that gets back in before an eject is
  # confirmed counts as a failed eject (it is ejected again and
  # not held), which broke getting back into a Grand Prix hole.
  bd_hole_grand:
    ball_switches: s_hole_grand
    eject_coil: c_hole_grand
    eject_timeouts: 2s
  bd_hole_prix:
    ball_switches: s_hole_prix
    eject_coil: c_hole_prix
    eject_timeouts: 2s
  bd_hole_backfire:
    ball_switches: s_hole_backfire
    eject_coil: c_hole_backfire
    eject_timeouts: 2s
    eject_coil_retry_pulse: 15s
