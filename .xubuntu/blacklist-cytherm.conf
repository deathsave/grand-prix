# The OPP board's Cypress USB-serial bridge reports USB ID 04b4:0002, which the
# kernel's "cytherm" (Cypress USB thermometer) driver also claims. If cytherm
# loads before cdc_acm it grabs the board and no /dev/ttyACM* (and therefore
# no /dev/ttyOPP0) is created. Never load cytherm so cdc_acm always wins.
blacklist cytherm
install cytherm /bin/false
