#show_version=6

# A super jackpot: the chimes roll 1-2-3, three times, then the "Double
# jackpot!" call out (super_jackpot_chimes_done, see
# config/common/sound_player.yaml). The overlay's up for all of it
# (see the modes' widget_player)
- time: 0
  coils: c_chime1
- time: "+0.08s"
  coils: c_chime2
- time: "+0.08s"
  coils: c_chime3
- time: "+0.3s"
  coils: c_chime1
- time: "+0.08s"
  coils: c_chime2
- time: "+0.08s"
  coils: c_chime3
- time: "+0.3s"
  coils: c_chime1
- time: "+0.08s"
  coils: c_chime2
- time: "+0.08s"
  coils: c_chime3
- time: "+0.3s"
  events: super_jackpot_chimes_done
- time: "+0.1s"
