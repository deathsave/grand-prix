# (sounds/preload/effects/red-line-heartbeat.wav, made by bin/heartbeat:
# 6 beats at 42 bpm, the first 0.4 of a beat in, the dub 0.22s after).
# Played (looped) with it, see modes/red_line/config/show_player.yaml

