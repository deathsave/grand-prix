#show_version=6

# Loops after the Death Save intro (see attract_apron):
# the splash (high scores) for 15s, then every gameplay
# tip from the Tips mode (modes/tips) for 10s each.
#
# There is one tip step per tip in
# modes/tips/content/tips.yaml (test_tips checks this),
# so add/remove a step when adding/removing a tip.
# Every slide change (timed or from the flippers) plays
# the whoosh effect.
#
# The Tips mode plays this show (modes/tips/code/tips.py)
# and picks each tip from the current step. The right
# flipper advances a step and the left flipper steps back.

- duration: 15s
  slides:
    splash_slide:
      action: play
  events: attract_tip_clear
  sounds: whoosh
# The Tips mode plays each tip's slide (see modes/tips)
- duration: 10s
  events: attract_tip
  sounds: whoosh
- duration: 10s
  events: attract_tip
  sounds: whoosh
- duration: 10s
  events: attract_tip
  sounds: whoosh
- duration: 10s
  events: attract_tip
  sounds: whoosh
- duration: 10s
  events: attract_tip
  sounds: whoosh
- duration: 10s
  events: attract_tip
  sounds: whoosh
- duration: 10s
  events: attract_tip
  sounds: whoosh
- duration: 10s
  events: attract_tip
  sounds: whoosh
- duration: 10s
  events: attract_tip
  sounds: whoosh
