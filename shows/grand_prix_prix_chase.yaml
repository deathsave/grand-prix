#show_version=6

# Grand Prix Multiball: lights PRIX in ascending order (1 to 4) one by one
# (each staying on), then all off and repeat.
# 1s steps, sped up by the show_player to match the music.

- duration: 1s
  lights:
    tag_lights_prix: off
- duration: 1s
  lights:
    l_prix1: on
- duration: 1s
  lights:
    l_prix2: on
- duration: 1s
  lights:
    l_prix3: on
- duration: 1s
  lights:
    l_prix4: on
