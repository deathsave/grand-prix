#config_version=6

sound_player:
  mode_luxury_started:
    luxury_starting:
      action: play
    million_dollars:
      action: play
      loops: -1
      delay: 1
  # a cash register under each shot's callout
  luxury_jackpot:
    jackpot:
      action: play
    cash_register:
      action: play
  luxury_complete{state == "claimed"}: cash_register
  # coins on the pops (unless it's Backfire Pops, which keeps its
  # sounds; Green Flag's notes skip the pops during Luxury)
  sw_tag_pops{not mode.backfire.active}: coins
  # (its callout comes after the chime rolls, see
  # config/common/sound_player.yaml)
  # then the "lap of luxury" callout once the super jackpot's
  # finishes (with both queued, one could get dropped)
  super_jackpot_callout_stopped: luxury_completed
