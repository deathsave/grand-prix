#config_version=6

# Shown when the jackpot callouts play, for twice as long
# as the callout (jackpot.ogg 0.87s, jackpot-double.ogg 1.14s)
widget_player:
  jackpot_callout_played:
    jackpot_luxury:
      key: jackpot_luxury
      widget_settings:
        expire: 1.75s
  super_jackpot_callout_played:
    jackpot_luxury:
      action: remove
      key: jackpot_luxury
    super_jackpot_luxury:
      key: super_jackpot_luxury
      widget_settings:
        expire: 2.3s
