#config_version=6

variable_player:
  # Ensure applicable switches don't score on
  # top of the amplified luxury shots:
  s_target_bonus_active:
    score: 0|block
  s_hole_prix_active:
    score: 0|block
  s_spinner_active:
    score: 0|block
  s_grooveline_active:
    score: 0|block
  s_hole_grand_active:
    score: 0|block
  s_target_save_active:
    score: 0|block
  # Each of the first five shots is a 75k jackpot (x the
  # multiplier, see event_player), the 6th is only the super jackpot
  luxury_jackpot:
    score: 75000 * current_player.multiplier|block
  # (the pops pay 500 during Luxury, see
  # modes/green_flag/config/variable_player.yaml)
  # 300k super jackpot
  luxury_complete:
    score: 300000|block
  # score normally if already claimed
  # luxury_claimed_hit:
  mode_luxury_started:
    mode_name:
      action: set_machine
      string: Lap of Luxury Multiball
