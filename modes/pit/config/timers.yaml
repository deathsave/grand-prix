#config_version=6

timers:
  # A fallback for players to ensure state is refreshed
  eternal:
    start_value: 0
    start_running: true
  skill_shot:
    start_value: 7
    end_value: 0
    direction: down
    control_events:
    # activate on initial ball launch
    - event: s_shooter_lane_inactive{not mode.green_flag.active}
      action: start

  # Hurry up timer for the "backfire pops"
  backfire_qualification:
    end_value: 0
    start_value: 15
    direction: down
    control_events:
    - event: start_backfire_qualification{game.balls_in_play > 0}
      action: start

  # Pure Evil lasts at most 40 seconds
  pure_evil:
    end_value: 0
    start_value: 40
    direction: down
    control_events:
    - event: pure_evil_enters{machine.is_pure_evil_available}
      action: start
    - event: mode_pure_evil_ended
      action: stop

  # timer for skillful plunge when starting a new
  # ball while green flag is active
  # the window to plunge in, centered on the green flag
  # dropping (the final ding): opens 0.4s before it
  # (shows/under_green.yaml) and runs 8 ticks of 0.1s = 0.8s
  off_the_line:
    start_value: 8
    end_value: 0
    direction: down
    tick_interval: "0.1s"
    control_events:
    - event: off_the_line_open
      action: start

  # Hurry up timer for the multiplier period
  multiplier:
    end_value: 0
    start_value: 30
    direction: down
    control_events:
    - event: player_multiplier{current_player.multiplier > 1 and not current_player.is_grooveline_boosted}
      action: start
    - event: player_multiplier{current_player.multiplier == 1}
      action: reset
    # Grooveline's super jackpot holds it until the mode ends
    - event: grooveline_multiplier_bumped
      action: stop
