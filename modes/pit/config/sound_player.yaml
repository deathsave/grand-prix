#config_version=6

sound_player:
  # Skill shot callouts
  off_the_line_hit: good
  # Bad luck (green_flag_bad_luck ends the ball): which bad luck it
  # was (modes/green_flag/config/random_event_player.yaml). Here, as
  # green flag has stopped by the time these are posted
  bad_luck_blow_out: bad_luck_blow_out
  bad_luck_seized_up: bad_luck_seized_up
  bad_luck_fuel_line: bad_luck_fuel_line
  off_the_line_late: late
  skill_backfire_hit: skill_shot
  # initially, player needs to top up
  # fuel to hit green flag
  mode_pit_started:
    pit_ambience:
      action: play
      loops: -1
  mode_backfire_stopped:
    pit_ambience:
      action: play
      loops: -1
  # Reminders to get into the backfire hole
  # and "too late" if not done in time
  timer_backfire_qualification_tick{ticks == 10 and not mode.backfire.active and not mode.green_flag.active}: backfire_reminder
  timer_backfire_qualification_tick{ticks == 1 and not mode.backfire.active and not mode.green_flag.active}: late
  mode_green_flag_stopped:
    pit_ambience:
      action: play
      loops: -1
  timer_eternal_tick{(ticks % 45 == 0) and current_player.score < 10 and current_player.tilt_warnings < 2}:
    fuel:
      action: play
  shooter_lane_plunged{current_player.score > 0 and current_player.tilt_warnings < 2}:
    rev:
      action: play
  # The engine starts as the first ball of the turn reaches the
  # shooter lane, then idles there until the plunge (posted by
  # modes/pit/code/pit.py)
  engine_start: engine_start
  # crossfading out of the start up (if it's still going, over its
  # last 0.75s)
  engine_idle:
    engine_start:
      action: stop
      fade_out: 0.75s
    engine_idle:
      action: play
      loops: -1
      fade_in: 0.75s
  engine_off:
    engine_start:
      action: stop
    engine_idle:
      action: stop
  engine_pace:
    engine_pace:
      action: play
      loops: -1
  engine_pace_off:
    engine_pace:
      action: stop
  pit_required_fuel:
    fuel:
      action: play
  pit_required_tires:
    tires:
      action: play
  # (synth for now, until there's a Steve call out)
  pit_required_lube:
    lube:
      action: play
  green_flag_degrade_all{current_player.level_tires == 1 or current_player.level_lube == 1 or current_player.level_fuel == 1}:
    pit:
      action: play
  # Only when a pit target actually tops up a low resource,
  # the bell otherwise (see event_player)
  pit_fuel_filled: pit_fuel
  pit_lube_filled: pit_lube
  pit_tires_filled: pit_tires
  # the left inlane's Tune Up (with its resource's fill sound, see
  # code/pit.py)
  tune_up: tune_up
  pit_resource_full: bell
  # fallback sound
  sw_tag_bell: bell
