#config_version=6

shots:
  skill_backfire:
    enable_events:
    - timer_skill_shot_started
    disable_events:
    - timer_skill_shot_complete
    - skill_backfire_hit
    switch: s_hole_backfire
  # either plunge or land in the backfire hole
  # in the brief (0.8s) window around the green flag
  # dropping (0.4s either side of the final ding)
  off_the_line:
    enable_events:
    - off_the_line_open
    disable_events:
    - timer_off_the_line_complete
    hit_events:
    - s_shooter_lane_inactive
    switch: s_hole_backfire
