#config_version=6

variable_player:
  ###########
  # Scoring #
  ###########

  # Most switches aren't worth much since
  # the drivers first goal is to get out
  # of the pit as fast as possible
  sw_pops:
    score: 10
  s_grooveline_active:
    score: 10
  # so skill shot isn't 1000 + 1
  s_backfire_hole_active{not device.timers.skill_shot.running}:
    score: 10
  s_prix_hole_active:
    score: 10
  s_grand_hole_active:
    score: 10
  s_spinner_active:
    score: 10
  s_save_target_active:
    score: 10
  s_bonus_target_active:
    score: 10
  s_swerve1_active:
    score: 10
  s_swerve2_active:
    score: 10
  s_slingshot1_active:
    score: 10
  s_slingshot2_active:
    score: 10
  s_inlane1_active:
    score: 10
  s_inlane2_active:
    score: 10
  s_outlane1_active:
    score: 10
  s_outlane2_active:
    score: 10

  # Skillshots immediately restore fuel resources
  skill_backfire_hit:
    score: 25000
    level_fuel:
      int: 2
      action: set
    level_lube:
      int: 2
      action: set
    level_tires:
      int: 2
      action: set
  off_the_line_hit:
    score: 5000
  sw_playfield_active:
    is_playfield_active:
      int: 1
      action: set

  #####################
  ## Limited scoring ##
  #####################
  s_pit_fuel_active:
    score: 100
    level_fuel:
      int: 2
      action: set
  s_pit_lube_active:
    score: 100
    level_lube:
      int: 2
      action: set
  s_pit_tires_active:
    score: 100
    level_tires:
      int: 2
      action: set

  logicblock_seq_lap_complete:
    lap_count: 1

  # Multiplier handling
  #
  # 5 is too much for the base mode
  # - we'll need to make getting this harder - only in multiball?
  #
  # logicblock_seq_lap_complete{(current_player.multiplier == 2) and device.timers.lap_to_lap.running}:
  #   multiplier:
  #     action: set
  #     int: 5
  logicblock_seq_lap_complete{(current_player.multiplier < 5) and device.timers.lap_to_lap.running}:
    multiplier:
      action: set
      int: 2
  mode_green_flag_stopped:
    multiplier:
      action: set
      int: 1
  timer_multiplier_complete:
    multiplier:
      action: set
      int: 1

  # For indicating multiball is ready
  # by lighting the multiball lamp
  # (see modes/pit/code/pit.py)
  logicblock_grooveline_counter_complete:
    is_multiball_ready: 1
  logicblock_luxury_counter_complete:
    is_multiball_ready: 1
  grand_prix_multiball_ready:
    is_multiball_ready: 1
    is_grand_prix_multiball_ready: 1
  logicblock_red_line_counter_complete:
    is_multiball_ready: 1
  multiball_stopped:
    is_multiball_ready:
      action: set
      int: 0
  mode_grand_prix_stopped:
    is_grand_prix_multiball_ready:
      action: set
      int: 0

  ##########################
  ## Base-mode prison fix ##
  ##########################
  mode_green_flag_started:
    is_green_flag_completed: 1

  ##########################
  ## Wizard-mode Progress ##
  ##########################
  multiball_grooveline_ended:
    is_grooveline_completed: 1
    game_progress: 1
  multiball_luxury_ended:
    is_luxury_completed: 1
  multiball_grand_prix_ended:
    is_grand_prix_completed: 1
  multiball_red_line_ended:
    is_red_line_completed: 1

  #####################
  ## Per-ball resets ##
  #####################
  ball_will_end:
    grooveline_counter_count:
      action: set
      int: 0
    is_playfield_active:
      int: 0
      action: set
