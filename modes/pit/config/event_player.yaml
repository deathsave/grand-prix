#config_version=6

event_player:
  # A pit target tops up its resource if it's low (the level is
  # filled on pit_*_filled, see variable_player, so the fill sound
  # can tell it happened), otherwise it's just the bell. Not in
  # Green Flag, which keeps the pit targets out of play.
  #
  # To activate "green_flag" mode, the user's vehicle
  # must be ready to race (not under a red flag, which only the
  # Grand hole gets you out of, see modes/under_red):
  s_pit_fuel_active:
  - pit_fuel_filled{current_player.level_fuel < 2 and not mode.green_flag.active}
  - pit_resource_full{current_player.level_fuel == 2 or mode.green_flag.active}
  - green_flag{current_player.level_lube == 2 and current_player.level_tires == 2 and not mode.under_red.active}
  s_pit_lube_active:
  - pit_lube_filled{current_player.level_lube < 2 and not mode.green_flag.active}
  - pit_resource_full{current_player.level_lube == 2 or mode.green_flag.active}
  - green_flag{current_player.level_fuel == 2 and current_player.level_tires == 2 and not mode.under_red.active}
  s_pit_tires_active:
  - pit_tires_filled{current_player.level_tires < 2 and not mode.green_flag.active}
  - pit_resource_full{current_player.level_tires == 2 or mode.green_flag.active}
  - green_flag{current_player.level_fuel == 2 and current_player.level_lube == 2 and not mode.under_red.active}
  # For Grand Prix, the multiball is NOT activated
  # with the general multiball switch.
  balldevice_bd_hole_prix_ball_entered{current_player.prix_counter_count >= 4 and current_player.grand_hole_locked_balls > 0 and not mode.grand_prix.active}:
  - grand_prix_multiball_ready
  balldevice_bd_hole_grand_ball_entered{current_player.grand_counter_count >= 5 and current_player.prix_hole_locked_balls > 0 and not mode.grand_prix.active}:
  - grand_prix_multiball_ready
  # The multiplier steps up (1x -> 2x -> 5x, see code/pit.py) for
  # completing Backfire Pops (carried into Green Flag) and the
  # super jackpots (Grooveline's bumps it itself, held until the
  # mode ends)
  logicblock_backfire_counter_complete:
  - multiplier_step
  grand_prix_super_jackpot:
  - multiplier_step
  # (the shot group also posts it as it starts, with every shot
  # "available")
  luxury_complete{state == "claimed"}:
  - multiplier_step
  red_line_checkered_flag:
  - multiplier_step
  # Multiball Started
  mode_grooveline_started:
  - multiball_started
  mode_luxury_started:
  - multiball_started
  mode_grand_prix_started:
  - multiball_started
  mode_red_line_started:
  - multiball_started
  # Multiball Stopped
  mode_grooveline_stopped:
  - multiball_stopped
  mode_luxury_stopped:
  - multiball_stopped
  mode_grand_prix_stopped:
  - multiball_stopped
  mode_red_line_stopped:
  - multiball_stopped
  player_level_tires_active:
  - pit_resource
  player_level_lube_active:
  - pit_resource
  player_level_fuel_active:
  - pit_resource
  # The skill shot and Backfire Pops earn a luxury step,
  # but they start green flag (where the luxury_counter
  # lives) so it is awarded once green flag has started
  mode_green_flag_started{current_player.luxury_step_pending == 1}:
  - luxury_step
  # Off the Line window closed with the ball still in the
  # shooter lane: the player was late (an early plunge isn't)
  timer_off_the_line_complete{device.switches.s_shooter_lane.state == 1}:
  - off_the_line_late
  # Either outlane uses the outlane save, if it's lit and nothing else
  # would return the ball (see code/pit.py)
  s_outlane1_active{current_player.is_outlane_save_lit == 1 and not device.ball_saves.ball_start.enabled and not device.ball_saves.safety_car.enabled and not device.multiballs.grooveline.shoot_again and not device.multiballs.luxury.shoot_again and not device.multiballs.grand_prix.shoot_again and not device.multiballs.red_line.shoot_again}:
  - outlane_save_redeem
  s_outlane2_active{current_player.is_outlane_save_lit == 1 and not device.ball_saves.ball_start.enabled and not device.ball_saves.safety_car.enabled and not device.multiballs.grooveline.shoot_again and not device.multiballs.luxury.shoot_again and not device.multiballs.grand_prix.shoot_again and not device.multiballs.red_line.shoot_again}:
  - outlane_save_redeem
  # The other one, qualified, starts as soon as one ends (while the
  # ball's still in play: not at the end of a ball, or after a tilt). See
  # modes/green_flag/config/event_player.yaml
  mode_luxury_stopped{current_player.grooveline_counter_count >= 10 and game.balls_in_play > 0 and not game.tilted and not mode.grooveline.active}:
  - grooveline_qualifier_hit
  mode_grooveline_stopped{current_player.luxury_counter_count >= 10 and current_player.is_luxury_played == 0 and game.balls_in_play > 0 and not game.tilted and not mode.luxury.active}:
  - luxury_qualifier_hit
