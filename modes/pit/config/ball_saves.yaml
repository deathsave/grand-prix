#config_version=6

ball_saves:
  ball_start:
    active_time: 10s
    # NOTE: hurry_up_time is INCLUDED in active_time
    hurry_up_time: 5s
    auto_launch: true
    grace_period: 2s
    only_last_ball: true # won't save if 2+ balls on playfield
    enable_events:
    - mode_pit_started
    timer_start_events:
    - sw_playfield_active
  # The Racing Gods' Safety Car: 15s of ball save, any time (see
  # modes/green_flag/config/random_event_player.yaml)
  safety_car:
    active_time: 15s
    hurry_up_time: 5s
    auto_launch: true
    grace_period: 2s
    enable_events:
    - racing_gods_safety_car
