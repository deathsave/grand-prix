#config_version=6

mode:
  start_events:
  # (not while another multiball is running)
  - sw_tag_hole_active{current_player.is_grooveline_played > 0 and current_player.is_grand_prix_played > 0 and current_player.is_luxury_played > 0 and not mode.grooveline.active and not mode.luxury.active and not mode.grand_prix.active}
  - debug_red_line
  stop_events:
  - multiball_red_line_ended
  restart_on_next_ball: false
  priority: 4000
  code: red_line.RedLine
