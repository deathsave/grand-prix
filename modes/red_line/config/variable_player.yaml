#config_version=6

variable_player:
  mode_red_line_started:
    mode_name:
      action: set_machine
      string: Red Line
  # see code/red_line.py
  red_line_shift:
    score: value
  red_line_checkered_flag:
    score: 2000000

  # At the red line, every switch but the Backfire hole (the shift)
