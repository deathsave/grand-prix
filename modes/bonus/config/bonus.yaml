    z: 3
    color: pink
    style: medium
    font_size: 34
    animations:
      add_to_slide: bonus_row_label_in
  - type: text
    text: (machine|bonus_row2_value)
    anchor_x: right
    x: 94%
    y: bottom+55%
    z: 3
    color: white
    style: medium
    font_size: 34
    animations:
      add_to_slide: bonus_row_value_in
  bonus_row3:
