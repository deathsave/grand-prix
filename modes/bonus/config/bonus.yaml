  bonus_total_row:
  - type: rectangle
    width: 720
    height: 3
    x: middle
    y: bottom+21%
    z: 3
    color: cyan
  - type: text
    text: Total
    anchor_x: left
    x: 6%
    y: bottom+11%
    z: 3
    color: cyan
    style: text_default
    font_size: 56
  - type: text
    text: (machine|bonus_total_value)
    anchor_x: right
    x: 94%
    y: bottom+11%
    z: 3
    color: gold
    style: medium
    font_size: 52
    animations:
      add_to_slide: pulsate_slow

# lines slide in from the right
animations:
  bonus_row_label_in:
  - property: x
    value: 800
    duration: 1ms
  - property: x
    value: 48
    duration: 0.35s
    easing: out_quad
  bonus_row_value_in:
  - property: x
    value: 1500
    duration: 1ms
  - property: x
    value: 752
    duration: 0.35s
    easing: out_quad

slide_player:
  mode_bonus_started: bonus_board

# each line (and the total) as code/bonus.py puts it up
widget_player:
  bonus_row_1_shown: bonus_row1
  bonus_row_2_shown: bonus_row2
  bonus_row_3_shown: bonus_row3
  bonus_row_4_shown: bonus_row4
  bonus_total_shown: bonus_total_row

sound_player:
  mode_bonus_started:
    pit_ambience:
      action: play
      loops: -1
      volume: 0.6
  bonus_start: bonus
  bonus_lap: bonus_laps
  bonus_total: start # god speed (for now)

show_player:
  # the Luxury inserts count down with the chime, from its line
  bonus_main:
    bonus_main:
      action: play
      loops: 0
      # start at 11 to compensate for 0 index
      start_step: (11 - current_player.luxury_counter_count)
  # (its 5s end show waits for the insert countdown, unless the
  # bonus was skipped)
  bonus_total{current_player.bonus_skipped == 0}:
    bonus_end:
      action: play
      loops: 0
  # Both flippers (MPF's both_flippers combo posts flipper_cancel)
  # hurry the bonus entries along (the bonus mode's hurry_up_event),
  # and stop the insert countdown and its chimes
  flipper_cancel:
    bonus_main:
      action: stop
    bonus_end:
      action: stop

# Skipping ends the bonus 1s after its total (which is when the score
# is added), or straight away if the total's already up
variable_player:
  mode_bonus_started:
    bonus_skipped:
      action: set
      int: 0
    bonus_totaled:
      action: set
      int: 0
  flipper_cancel:
    bonus_skipped:
      action: set
      int: 1
  bonus_total:
    bonus_totaled:
      action: set
      int: 1

event_player:
  bonus_total{current_player.bonus_skipped == 1}:
  - bonus_show_ended|1s
  flipper_cancel{current_player.bonus_totaled == 1}:
  - bonus_show_ended
