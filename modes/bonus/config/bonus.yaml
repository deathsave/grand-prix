#config_version=6

mode:
  priority: 10000
  # (only if there's something to pay, see the entries)
  start_events:
  - ball_ending{current_player.luxury_counter_count > 0 or current_player.lap_count > 0 or current_player.bonus_multiballs > 0}
  stop_events:
  - ball_starting
  # MPF's bonus mode, putting each line up on a results board (see
  # code/bonus.py)
  code: bonus.GrandPrixBonus

mode_settings:
  display_delay_ms: 4000
  end_bonus_event: bonus_show_ended
  # (display in the order here; only the lines the player earned
  # anything for, skip_if_zero)
  bonus_entries:
  # the Luxury chain, 10k an insert (it never resets)
  - event: bonus_main
    score: 10000
    player_score_entry: luxury_counter_count
    skip_if_zero: true
  # 1k a lap
  - event: bonus_lap
    score: 1000
    player_score_entry: lap_count
    skip_if_zero: true
  # 10k for each multiball played (bonus_multiballs, counted as the
  # ball ends in modes/pit/code/pit.py)
  - event: bonus_multiballs
    score: 10000
    player_score_entry: bonus_multiballs
    skip_if_zero: true
  # 30k for each one completed (its super jackpot, or Red Line's
  # checkered flag)
  - event: bonus_supers
    score: 30000
    player_score_entry: bonus_supers
    skip_if_zero: true

# A race results board: each line slides in with its points counting
# up (see code/bonus.py), then the total
slides:
  bonus_board:
  # (the green flag background: less busy than the splash)
  - widget: green_flag_background
  - widget: tip_dim
  - type: text
    text: End of Ball Bonus
    x: middle
    y: bottom+86%
    z: 2
    color: cyan
    style: text_default
    font_size: 70

widgets:
  bonus_row1:
  - type: text
    text: (machine|bonus_row1_label)
    anchor_x: left
    x: 6%
    y: bottom+68%
    z: 3
    color: pink
    style: medium
    font_size: 34
    animations:
      add_to_slide: bonus_row_label_in
  - type: text
    text: (machine|bonus_row1_value)
    anchor_x: right
    x: 94%
    y: bottom+68%
    z: 3
    color: white
    style: medium
    font_size: 34
    animations:
      add_to_slide: bonus_row_value_in
  bonus_row2:
