#config_version=6

# Shown when the jackpot callouts play, for twice as long
# as the callout (jackpot.ogg 0.87s, jackpot-double.ogg 1.14s)
widget_player:
  jackpot_callout_played:
    jackpot_grooveline:
      key: jackpot_grooveline
      widget_settings:
        expire: 1.75s
  # the super jackpot, from when it hits, through the chime rolls
  # (1.4s) and the callout (twice its 1.14s)
  grooveline_super_jackpot:
    jackpot_grooveline:
      action: remove
      key: jackpot_grooveline
    super_jackpot_grooveline:
      key: super_jackpot_grooveline
      widget_settings:
        expire: 3.7s
