#config_version=6

variable_player:
  mode_grooveline_started:
    mode_name:
      action: set_machine
      string: Grooveline Multiball
  # see code/grooveline.py: 30k, each one worth 5k more (x the
  # multiplier), and a 250k super jackpot
  grooveline_jackpot:
    score: value * current_player.multiplier
  grooveline_super_jackpot:
    score: 250000
