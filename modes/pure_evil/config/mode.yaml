#config_version=6

mode:
  start_events:
  - pure_evil_enters{machine.is_pure_evil_available}
  stop_events:
  - pure_evil_exits
  # ensure the long bonus sequence isn't laughing in your face
  - ball_will_end
  - timer_pure_evil_complete
  priority: 5000

variable_player:
  # delay setting the value out of range slightly
  timer_eternal_tick{current_player.evil_number < 999999}:
    evil_number: 999999
  timer_eternal_tick:
    score: -(current_player.score / 100)

event_player:
  # we wait for the slight delay before we
  # allow the player to end the mode to prevent
  # the c_disqualifier_up from triggering it
  s_disqualifier_active{current_player.evil_number >= 999999}:
  - pure_evil_exits

slide_player:
  mode_pure_evil_started: pure_evil_slide

show_player:
  mode_pure_evil_started:
    flash_color:
      speed: 8
      show_tokens:
        led: tag_rgb
        color: red

# Only the sirens: silence the background music and ambience
# (the taunts and gameplay sounds still play) and bring them
# back after (to their config/common/sound_system.yaml volumes)
track_player:
  mode_pure_evil_started:
    music:
      action: set_volume
      volume: 0
      fade: 500ms
    ambience:
      action: set_volume
      volume: 0
      fade: 500ms
  mode_pure_evil_stopping:
    music:
      action: set_volume
      volume: 0.4
      fade: 1s
    ambience:
      action: set_volume
      volume: 0.2
      fade: 1s

# A taunt 5 seconds in, then every 10 seconds (5s ticks,
# taunting on the odd ones: 5s, 15s, 25s, 35s)
timers:
  pure_evil_taunts:
    start_value: 0
    direction: up
    tick_interval: 5s
    start_running: true

sound_player:
  timer_pure_evil_taunts_tick{ticks % 2 == 1}: pure_evil_taunt
  mode_pure_evil_started:
    civil_siren:
      action: play
      loops: -1
  mode_pure_evil_stopping:
    civil_siren:
      action: stop
