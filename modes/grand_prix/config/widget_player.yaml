#config_version=6

# Shown when the jackpot callouts play, for twice as long
# as the callout (jackpot.ogg 0.87s, jackpot-double.ogg 1.14s)
widget_player:
  # every lap (see code/grand_prix.py)
  grand_prix_leader_bonus:
    leader_bonus_grand_prix:
      key: leader_bonus_grand_prix
      widget_settings:
        expire: 2s
  jackpot_callout_played:
    jackpot_grand_prix:
      key: jackpot_grand_prix
      widget_settings:
        expire: 1.75s
  # the super jackpot, from when it hits, through the chime rolls
  # (1.4s) and the callout (twice its 1.14s)
  grand_prix_super_jackpot:
    jackpot_grand_prix:
      action: remove
      key: jackpot_grand_prix
    super_jackpot_grand_prix:
      key: super_jackpot_grand_prix
      widget_settings:
        expire: 3.7s
