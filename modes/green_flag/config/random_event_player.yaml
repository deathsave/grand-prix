#config_version=6

# Every 3 laps, a random event will occur
random_event_player:
  player_lap_counter_count{(current_player.lap_counter_count % 3 == 0) and (current_player.lap_counter_count > 0) and machine.is_wear_and_tear_available}:
    force_all: false
    events:
      # 20% the Racing Gods are kind: 8% things are going smoothly,
      # and 3% each for a blessing (see event_player.yaml)
      green_flag_smooth_sailing: 8
      racing_gods_safety_car: 3
      racing_gods_sponsor: 3
      racing_gods_slipstream: 3
      racing_gods_lucky_charm: 3
      # 74% chance of normal wear and tear
      green_flag_degrade_fuel: 20
      green_flag_degrade_lube: 20
      green_flag_degrade_tires: 20
      green_flag_degrade_all: 14
      # 5% chance of a multi-car wreck (a red flag, modes/under_red)
      green_flag_under_red: 5
      # Tiny chance ball ends immediately
      green_flag_bad_luck: 1
  green_flag_bad_luck:
    events:
    - bad_luck_blow_out
    - bad_luck_seized_up
    - bad_luck_fuel_line
  s_disqualifier_active:
    events:
    - green_flag_degrade_fuel
    - green_flag_degrade_lube
    - green_flag_degrade_tires
