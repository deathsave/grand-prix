#config_version=6

mode:
  start_events:
  - green_flag
  # shortcuts to resume/start green flag
  - logicblock_backfire_counter_complete
  - skill_backfire_hit
  # immediately start green flag on ball 2 if player whiffed ball 1
  - ball_started{current_player.ball == 2 and current_player.is_green_flag_completed == 0}
  stop_events:
  - pit_required_lube
  - pit_required_fuel
  - pit_required_tires
  - green_flag_bad_luck
  - green_flag_degrade_all{current_player.level_tires == 1 or current_player.level_lube == 1 or current_player.level_fuel == 1}
  events_when_stopped:
  - start_backfire_qualification
  restart_on_next_ball: true
  priority: 2000
