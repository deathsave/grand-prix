#config_version=6

variable_player:
  ##################
  ## Base Scoring ##
  ##################
  # (nothing at Red Line's red line, which scores like the pit
  # instead, see modes/red_line/config/variable_player.yaml)
  # (500 during Lap of Luxury, under Backfire Pops' 1k-10k climb, which
  # blocks this when it's running. Here rather than in Luxury: a
  # conditional entry there doesn't block this one)
  sw_tag_pops:
    score: (50 + 450 * mode.luxury.active) * current_player.multiplier * (1 - current_player.red_line_at_redline)|block
  s_grooveline_active:
    score: 500 * current_player.multiplier * (1 - current_player.red_line_at_redline)|block
  s_hole_backfire_active{not device.timers.skill_shot.running}:
    score: 2500 * current_player.multiplier|block
  s_hole_prix_active:
    score: 500 * current_player.multiplier * (1 - current_player.red_line_at_redline)|block
  s_hole_grand_active:
    score: 500 * current_player.multiplier * (1 - current_player.red_line_at_redline)|block
  s_spinner_active:
    score: 50 * current_player.multiplier * (1 - current_player.red_line_at_redline)|block
  s_target_save_active:
    score: 50 * current_player.multiplier * (1 - current_player.red_line_at_redline)|block
  s_target_bonus_active:
    score: 50 * current_player.multiplier * (1 - current_player.red_line_at_redline)|block
  s_swerve1_active:
    score: 50 * current_player.multiplier * (1 - current_player.red_line_at_redline)|block
  s_swerve2_active:
    score: 50 * current_player.multiplier * (1 - current_player.red_line_at_redline)|block
  s_slingshot1_active:
    score: 50 * current_player.multiplier * (1 - current_player.red_line_at_redline)|block
  s_slingshot2_active:
    score: 50 * current_player.multiplier * (1 - current_player.red_line_at_redline)|block
  s_inlane1_active:
    score: 150 * current_player.multiplier * (1 - current_player.red_line_at_redline)|block
  s_inlane2_active:
    score: 150 * current_player.multiplier * (1 - current_player.red_line_at_redline)|block
  s_outlane1_active:
    score: 250 * current_player.multiplier * (1 - current_player.red_line_at_redline)|block
  s_outlane2_active:
    score: 250 * current_player.multiplier * (1 - current_player.red_line_at_redline)|block

  mode_green_flag_started:
    level_green_flag:
      action: add
      int: 1
  green_flag_degrade_fuel:
    level_fuel:
      action: add
      int: -1
  green_flag_degrade_lube:
    level_lube:
      action: add
      int: -1
  green_flag_degrade_tires:
    level_tires:
      action: add
      int: -1
  green_flag_degrade_all:
    level_fuel:
      action: add
      int: -1
    level_lube:
      action: add
      int: -1
    level_tires:
      action: add
      int: -1
  s_pit_fuel_active:
    level_fuel: 0|block
  s_pit_lube_active:
    level_lube: 0|block
  s_pit_tires_active:
    level_tires: 0|block

  # "Swerving during multiballs triggers the first-level multiplier
  logicblock_swerve_counter_complete{(current_player.multiplier < 5)}:
    multiplier:
      action: set
      int: 2
  logicblock_lap_counter_updated:
    lap_counter_count:
      action: set
      int: value
  logicblock_spin_counter_updated:
    spin_counter_count:
      action: set
      int: value
  logicblock_grooveline_counter_updated:
    grooveline_counter_count:
      action: set
      int: value
  logicblock_luxury_counter_updated:
    luxury_counter_count:
      action: set
      int: value
  logicblock_grand_counter_updated:
    grand_counter_count:
      action: set
      int: value
  logicblock_prix_counter_updated:
    prix_counter_count:
      action: set
      int: value
  logicblock_grand_prix_counter_updated:
    grand_prix_counter_count:
      action: set
      int: value
  logicblock_awareness_counter_updated:
    awareness_counter_count:
      action: set
      int: value

  # a lap pays 5k (like the switches, nothing at Red Line's red
  # line, which scores like the pit)
  logicblock_seq_lap_complete:
    lap_count: 1
    score: 5000 * current_player.multiplier * (1 - current_player.red_line_at_redline)
  multiplier_lap:
    lap_count: 1

  # Multiplier handling
  #
  # 5 is too much for the base mode
  # - we'll need to make getting this harder - only in multiball?
  #
  # logicblock_seq_lap_complete{(current_player.multiplier == 2) and device.timers.lap_to_lap.running}:
  #   multiplier:
  #     action: set
  #     int: 5
  logicblock_seq_lap_complete{(current_player.multiplier < 5) and device.timers.lap_to_lap.running}:
    multiplier:
      action: set
      int: 2
