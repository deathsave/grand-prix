#config_version=6

sound_player:
  # (see event_player: whoosh while a ball save's on)
  outlane_drain:
    welp:
      block: true
  outlane_saved:
    whoosh:
      block: true
  s_inlane2_active:
    swoop:
      block: true
  sw_tag_bell:
    nothing:
      block: true
  sw_tag_slings:
    boing:
      block: true
  # (Lap of Luxury's coins instead, see modes/luxury/config/
  # sound_player.yaml: a conditional entry there doesn't block this)
  sw_tag_pops{not mode.luxury.active}:
    green_flag_notes:
      block: true
  sw_tag_rev:
    rev:
      block: true
  logicblock_grand_counter_hit:
    rev:
      block: true
  logicblock_prix_counter_hit:
    rev:
      block: true
  logicblock_lap_counter_hit:
    fly_by:
      block: true
  logicblock_grand_counter_complete:
    fly_by:
      block: true
  logicblock_prix_counter_complete:
    fly_by:
      block: true
  sw_tag_swerve:
    swerve:
      block: true
  mode_pure_evil_started: pure_evil_enters
  # Wear and Tear's nothing burger: things are going fine
  green_flag_smooth_sailing: smooth_sailing
  # The music and crowd come in a few seconds after Green Flag starts
  # (or the music after a multiball), from this mode's timers (see
  # timers.yaml), which stop with it: a sound_player delay can't be
  # cancelled, so Green Flag ending inside it (the ball ending just
  # after it started) left the music playing into the next ball
  mode_green_flag_started:
    pit_ambience:
      action: stop
  timer_green_flag_music_complete:
    blinding_lights:
      action: play
      loops: -1
  timer_green_flag_crowd_complete:
    at_the_track:
      action: play
      loops: -1
      priority: 5000
  # (Red Line swaps it for its reverbed crowd)
  mode_red_line_stopped:
    at_the_track:
      action: play
      loops: -1
      priority: 5000
  mode_green_flag_will_stop:
    blinding_lights:
      action: stop
    at_the_track:
      action: stop

  ##########################
  ## Grooveline Multiball ##
  ##########################

  logicblock_grooveline_counter_complete:
    grooveline_multiball_ready:
      action: play
      delay: 0.5

  ############################
  ## Money/Luxury Multiball ##
  ############################

  logicblock_luxury_counter_complete:
    luxury_multiball_ready:
      action: play
      delay: 0.5

  ##########################
  ## Grand Prix Multiball ##
  ##########################
  multiball_lock_grand_hole_locked_ball{current_player.prix_hole_locked_balls == 0}:
    grand_prix_ball_locked:
      action: play
      delay: 0.5
  multiball_lock_prix_hole_locked_ball{current_player.grand_hole_locked_balls == 0}:
    grand_prix_ball_locked:
      action: play
      delay: 0.5
  multiball_lock_grand_hole_locked_ball{current_player.prix_hole_locked_balls > 0}:
    ball_two_locked:
      action: play
      delay: 0.5
  multiball_lock_prix_hole_locked_ball{current_player.grand_hole_locked_balls > 0}:
    ball_two_locked:
      action: play
      delay: 0.5
