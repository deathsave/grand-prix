#config_version=6

show_player:
  # (the multiball lamp blinks from modes/pit/code/pit.py when one
  # is ready)
  sw_tag_rev:
    lights_blink:
      speed: 1.5
      loops: 0
      show_tokens:
        lights: l_tach
  logicblock_lap_counter_hit:
    lap_chaser:
      loops: 0
      show_tokens:
        color: lime
  multiball_started:
    token_color_run:
      action: stop
  player_grooveline_counter_count{current_player.grooveline_counter_count == 10}:
    token_color_run:
      show_tokens:
        tag: tag_lights_grooveline
        color: cyan
        light1: l_grooveline01
        light2: l_grooveline02
        light3: l_grooveline03
        light4: l_grooveline04
        light5: l_grooveline05
        light6: l_grooveline06
        light7: l_grooveline07
        light8: l_grooveline08
        light9: l_grooveline09
        light10: l_grooveline10
  mode_green_flag_started:
    under_green:
      loops: 0
      sync_ms: 2000
    flash_color:
      speed: 3
      show_tokens:
        led: tag_lights_mode
        color: lime
