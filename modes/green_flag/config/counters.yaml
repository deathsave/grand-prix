#config_version=6

counters:
  lap_counter:
    count_events:
    - logicblock_seq_lap_complete
    - logicblock_rubbing_is_racing_counter_complete
    starting_count: 0
    count_interval: 1

  swerve_counter:
    count_events:
    - sw_tag_swerve{mode.grooveline.active}
    - sw_tag_swerve{mode.luxury.active}
    - sw_tag_swerve{mode.grand_prix.active}
    starting_count: 0
    count_interval: 1
    count_complete_value: 5
    reset_on_complete: false
    reset_events:
    - multiball_stopped

  # Use the pops as another way to make a lap
  rubbing_is_racing_counter:
    count_events:
    - s_pop1_active
    - s_pop2_active
    starting_count: 0
    count_interval: 1
    count_complete_value: 20
    persist_state: true
    reset_on_complete: true
    disable_on_complete: false

  # Every 8 spins is a step of the luxury_counter.
  # The swerve switches count like spinner hits.
  spin_counter:
    count_events:
    - s_spinner_active
    - sw_tag_swerve
    starting_count: 0
    count_interval: 1
    count_complete_value: 8
    persist_state: true
    reset_on_complete: true
    disable_on_complete: false
    # with the multiplier (2X...) each spin counts that
    # many times (the count_event adds the first)
    control_events:
    - event: s_spinner_active{current_player.multiplier > 1}
      action: add
      value: current_player.multiplier - 1
    - event: sw_tag_swerve{current_player.multiplier > 1}
      action: add
      value: current_player.multiplier - 1

  # This is the per-ball lap counter:
  #   We keep state between mode changes
  #   BUT WILL RESET ON BALL END
  #   (see Pit Mode variable_player + custom code)
  grooveline_counter:
    count_events:
    - logicblock_lap_counter_hit
    starting_count: 0
    count_interval: 1
    count_complete_value: 10
    persist_state: true
    reset_on_complete: false
    reset_events:
    - multiball_grooveline_started
    control_events:
    - event: multiplier_lap
      action: add
      value: 1

  # This is the LONG counter, across all balls. Each step
  # lights a Luxury/Bonus insert (10,000 bonus) from:
  # - every 8 spins (spin_counter)
  # - every lap
  # - the skill shot, off the line and Backfire Pops
  #   (the skill shot and Backfire Pops start green flag,
  #   so the pit posts luxury_step once it has started)
  luxury_counter:
    count_events:
    - logicblock_spin_counter_complete
    - logicblock_lap_counter_hit
    - off_the_line_hit
    - luxury_step
    starting_count: 0
    count_interval: 1
    count_complete_value: 10
    persist_state: true
    reset_on_complete: false

  # This first counter lights the "GRAND" inserts.
  grand_counter:
    reset_on_complete: false
    disable_on_complete: true
    count_events: s_target_save_active
    starting_count: 0
    count_interval: 1
    count_complete_value: 5
    persist_state: true
    reset_events:
    - mode_grand_prix_stopped
    enable_events:
    - mode_grand_prix_stopped
    start_enabled: true
  prix_counter:
    reset_on_complete: false
    disable_on_complete: true
    count_events: s_target_bonus_active
    starting_count: 0
    count_interval: 1
    count_complete_value: 4
    persist_state: true
    reset_events:
    - mode_grand_prix_stopped
    enable_events:
    - mode_grand_prix_stopped
    start_enabled: true

  # "awareness" is being able to hit the bonus target
  # WITHOUT getting into the hole near it
  awareness_counter:
    reset_on_complete: true
    disable_on_complete: false
    count_events: s_target_bonus_active
    starting_count: 0
    count_interval: 1
    count_complete_value: 4
    persist_state: true
    reset_events:
    - s_hole_prix_active
    # start
    - mode_grand_prix_started
    enable_events:
    - logicblock_prix_counter_complete
    - s_target_bonus_active{current_player.prix_counter_count == 4}
    disable_events:
    # the "awareness" is being able to hit the targets
    # without getting in the hole
    - s_hole_prix_active

