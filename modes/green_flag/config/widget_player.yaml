#config_version=6

widget_player:
  # Off the Line countdown, posted by the chimes in
  # shows/under_green.yaml (each replaces the one before), after
  # Get Ready from the moment Green Flag starts (the countdown waits
  # for its show's sync, so it would show the green flag slide
  # first). (Posted by the event_player: the display's side of the
  # mode isn't running yet on mode_green_flag_started)
  off_the_line_get_ready:
    countdown_ready:
      widget_settings:
        expire: 5s
  # (each number stays up past its 1s, so the next one always takes
  # over from it: with exactly 1s, one arriving a frame late let the
  # green flag slide flash through)
  off_the_line_countdown3:
    countdown_ready:
      action: remove
    countdown3:
      widget_settings:
        expire: 1.5s
  off_the_line_countdown2:
    countdown3:
      action: remove
    countdown2:
      widget_settings:
        expire: 1.5s
  off_the_line_countdown1:
    countdown2:
      action: remove
    countdown1:
      widget_settings:
        expire: 1.5s
  green_flag_dropped:
    countdown1:
      action: remove
    countdown_race:
      widget_settings:
        expire: 1.5s
  # A successful Off the Line skill shot (plunged right on the final
  # ding, within 0.4s either side), over (or instead of) Race!
  off_the_line_hit:
    countdown1:
      action: remove
    countdown_race:
      action: remove
    off_the_line_skill_shot:
      key: off_the_line_skill_shot
      widget_settings:
        expire: 3s
