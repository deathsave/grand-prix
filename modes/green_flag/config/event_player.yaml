#config_version=6

event_player:
  # The outlanes: the welp when the ball's lost, a whoosh while a ball
  # save, a multiball's shoot again or the outlane save (see
  # modes/pit/code/pit.py) will put it back (see sound_player)
  s_outlane1_active:
  - outlane_saved{current_player.is_outlane_save_lit == 1 or device.ball_saves.ball_start.enabled or device.multiballs.grooveline.shoot_again or device.multiballs.luxury.shoot_again or device.multiballs.grand_prix.shoot_again or device.multiballs.red_line.shoot_again}
  # (no parentheses: event_player reads them as placeholders)
  - outlane_drain{current_player.is_outlane_save_lit == 0 and not device.ball_saves.ball_start.enabled and not device.multiballs.grooveline.shoot_again and not device.multiballs.luxury.shoot_again and not device.multiballs.grand_prix.shoot_again and not device.multiballs.red_line.shoot_again}
  s_outlane2_active:
  - outlane_saved{current_player.is_outlane_save_lit == 1 or device.ball_saves.ball_start.enabled or device.multiballs.grooveline.shoot_again or device.multiballs.luxury.shoot_again or device.multiballs.grand_prix.shoot_again or device.multiballs.red_line.shoot_again}
  - outlane_drain{current_player.is_outlane_save_lit == 0 and not device.ball_saves.ball_start.enabled and not device.multiballs.grooveline.shoot_again and not device.multiballs.luxury.shoot_again and not device.multiballs.grand_prix.shoot_again and not device.multiballs.red_line.shoot_again}
  # Off the Line's Get Ready (see widget_player)
  mode_green_flag_started:
  - off_the_line_get_ready
  green_flag_degrade_fuel{current_player.level_fuel == 1}:
  - pit_required_fuel
  green_flag_degrade_lube{current_player.level_lube == 1}:
  - pit_required_lube
  green_flag_degrade_tires{current_player.level_tires == 1}:
  - pit_required_tires
  logicblock_seq_lap_complete{current_player.multiplier == 2}:
  - multiplier_lap
