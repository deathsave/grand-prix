#config_version=6

event_player:
  # The outlanes: the welp when the ball's lost, a whoosh while a ball
  # save, a multiball's shoot again or the outlane save (see
  # modes/pit/code/pit.py) will put it back (see sound_player)
  # (the left one only once its switch works, see
  # config/common/variables.yaml)
  s_outlane1_active{machine.is_left_lanes_working == 1}:
  - outlane_saved{current_player.is_outlane_save_lit == 1 or device.ball_saves.ball_start.enabled or device.ball_saves.safety_car.enabled or device.multiballs.grooveline.shoot_again or device.multiballs.luxury.shoot_again or device.multiballs.grand_prix.shoot_again or device.multiballs.red_line.shoot_again}
  # (no parentheses: event_player reads them as placeholders)
  - outlane_drain{current_player.is_outlane_save_lit == 0 and not device.ball_saves.ball_start.enabled and not device.ball_saves.safety_car.enabled and not device.multiballs.grooveline.shoot_again and not device.multiballs.luxury.shoot_again and not device.multiballs.grand_prix.shoot_again and not device.multiballs.red_line.shoot_again}
  s_outlane2_active:
  - outlane_saved{current_player.is_outlane_save_lit == 1 or device.ball_saves.ball_start.enabled or device.ball_saves.safety_car.enabled or device.multiballs.grooveline.shoot_again or device.multiballs.luxury.shoot_again or device.multiballs.grand_prix.shoot_again or device.multiballs.red_line.shoot_again}
  - outlane_drain{current_player.is_outlane_save_lit == 0 and not device.ball_saves.ball_start.enabled and not device.ball_saves.safety_car.enabled and not device.multiballs.grooveline.shoot_again and not device.multiballs.luxury.shoot_again and not device.multiballs.grand_prix.shoot_again and not device.multiballs.red_line.shoot_again}
  # Off the Line's Get Ready (see widget_player)
  mode_green_flag_started:
  - off_the_line_get_ready
  green_flag_degrade_fuel{current_player.level_fuel == 1}:
  - pit_required_fuel
  green_flag_degrade_lube{current_player.level_lube == 1}:
  - pit_required_lube
  green_flag_degrade_tires{current_player.level_tires == 1}:
  - pit_required_tires
  logicblock_seq_lap_complete{current_player.multiplier == 2}:
  - multiplier_lap
  # The multiball target starts Grooveline or Luxury whenever its chain
  # is full (Luxury only once a game: its chain stays maxed for the
  # bonus). With both qualified it's Luxury first, the smaller of the
  # two (675k completed, to Grooveline's 700k and its multiplier bump),
  # then Grooveline as soon as it ends (see
  # modes/pit/config/event_player.yaml); one doesn't start during the
  # other. (From the counts, not their complete events: those only
  # fire once, so a qualified multiball used to be lost if the ball
  # went back to the pit, or drained, before the target)
  s_target_multiball_active{current_player.luxury_counter_count >= 10 and current_player.is_luxury_played == 0 and not mode.luxury.active and not mode.grooveline.active}:
  - luxury_qualifier_hit
  # (Grooveline when Luxury isn't waiting: its chain isn't full, or
  # it's been played. No parentheses: event_player reads them as
  # placeholders)
  s_target_multiball_active{current_player.grooveline_counter_count >= 10 and current_player.luxury_counter_count < 10 and not mode.grooveline.active and not mode.luxury.active}:
  - grooveline_qualifier_hit
  s_target_multiball_active{current_player.grooveline_counter_count >= 10 and current_player.is_luxury_played == 1 and not mode.grooveline.active and not mode.luxury.active}:
  - grooveline_qualifier_hit
