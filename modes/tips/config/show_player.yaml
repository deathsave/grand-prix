#config_version=6

# Both events are posted by the Tips mode code (code/tips.py)
show_player:
  # Death Save intro finished, start rotating
  # splash <-> tips from the splash (step 1)
  tips_rotation_start:
    attract_rotation:
      key: attract_rotation
      loops: -1
  # A flipper was pressed: jump straight to the
  # next tip (step 2) and restart its 15 seconds
  tips_skip:
    attract_rotation:
      key: attract_rotation
      start_step: 2
      loops: -1
