#config_version=6

# The Tips mode code posts the slide's name with the side it slides in
# from, <slide>_from_right or <slide>_from_left (see code/tips.py):
# the side of the flipper button pressed, or the right when the
# rotation moves on by itself. (move_in's direction is the way it
# moves: left comes in from the right)
slide_player:
  splash_slide_from_right:
    splash_slide:
      transition:
        type: move_in
        direction: left
        duration: 0.4s
  splash_slide_from_left:
    splash_slide:
      transition:
        type: move_in
        direction: right
        duration: 0.4s
  tip_slide_from_right:
