# Gameplay tips shown during Attract Mode, one per slide.
#
# Each tip has a title and up to 4 lines. Keep lines under
# ~48 characters so they fit the 800px apron display.
#
# `mode` (optional) gives the tip that mode's look, usually
# its background dimmed behind the text. It needs a matching
# tip_<mode>_slide in config/common/slides.yaml and a line in
# the Tips mode's config/slide_player.yaml.

- title: Get Under Green
  mode: green_flag
  lines:
  - "1. Skill shot: plunge into the Backfire Hole"
  - "2. Fill up fuel, lube & tires in the pit"
  - "3. Backfire: hit the Spinner, then the"
  - "    Backfire Hole, then 10 pop bumpers"

- title: "Back... Fire... Pops! Alright?"
  mode: backfire
  lines:
  - "Leaving Green Flag? Quick! Hit the Spinner,"
  - "then get into the Backfire Hole"
  - "Pops score 1K, 2K, 3K... up to 10K"
  - "10 pops and you're back under green"

- title: Grooveline Multiball
  mode: grooveline
  lines:
  - "Laps under green light the 10 Grooveline"
  - "inserts. Then hit the multiball target!"
  - "Blinking shots relight them from the bottom:"
  - "growing Jackpots, then Super Jackpot + 2X"

- title: Lap of Luxury
  mode: luxury
  lines:
  - "Light Luxury inserts under green with laps,"
  - "8 spins/swerves (2X counts double), skill"
  - "shots & Backfire Pops. It never resets!"
  - "Light all 10, then hit the multiball target"

- title: Grand Prix Multiball
  mode: grand_prix
  lines:
  - "1. Left target 5x for GRAND, lock Grand Hole"
  - "2. Right target 4x for PRIX, lock Prix Hole"
  - "3. Shoot the Backfire Hole to start the race"
  - "4. Fill all 3 holes again for the Super Jackpot"

- title: Extra Ball & 2X
  mode: extra_ball
  lines:
  - "PRIX lit? Hit the bonus target 4 more times"
  - "(skip the Prix Hole), collect at right inlane"
  - "Swerve 5x in multiball or chain 2 laps in"
  - "15s for 2X scoring and bonus for 30 seconds"

- title: Red Line
  mode: red_line
  lines:
  - "Finish Grooveline, Lap of Luxury and"
  - "Grand Prix multiballs, then enter any hole"
  - "to start the Red Line wizard mode"

- title: Pure Evil
  mode: pure_evil
  lines:
  - "Every second costs you points"
  - "Hit the drop target to stop the bleeding"
