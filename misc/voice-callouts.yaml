# Synth voice call outs, made by bin/voice-callout
#
# Each call out is its file name (sounds/preload/voice/synth/<name>.ogg,
# sound name with underscores in config/common/sounds.yaml) and what's
# said. Edit the text or the voice and re-run:
#
#   bin/voice-callout              # all of them
#   bin/voice-callout jackpot      # just one
#   bin/voice-callout add <name> "<text>"   # a new one
#
# A call out can also have its own speed (0.5 is half speed, 2 is
# double, without changing the pitch):
#
#   name1: {text: "Juan!", speed: 0.5}
#
# Try a voice (or --rate) first with --voice (e.g. bin/voice-callout jackpot
# --voice Ralph --play). See all with: say -v '?'
#
# Transcribed from the original Vicki call outs. Those marked
# "check" couldn't be confirmed word for word, so give them a listen.
#
# Not here: bonus3 (it has custom audio mixed in), which
# bin/voice-crush handles like the other voice audio.

voice: "Tara"
# words per minute (say -r). Tara's default is about 172, 130 is
# about 10% slower. Try one with: bin/voice-callout jackpot --rate 120 --play
rate: 130

